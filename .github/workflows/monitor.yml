name: E-Consular Appointment Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Sérialise les runs (déclenchement chaque minute) SANS annuler un run en cours —
# crucial : ne jamais tuer un run qui est en train de RÉSERVER un créneau.
concurrency:
  group: econsular-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Cache du binaire Chromium — évite le re-téléchargement de 175 Mo à chaque run
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium (cached)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Browser en cache — install deps système seulement"
            npx playwright install-deps chromium || true
          else
            npx playwright install chromium --with-deps
          fi

      - name: Run availability check
        env:
          EC_EMAIL: ${{ secrets.EC_EMAIL }}
          EC_PASSWORD: ${{ secrets.EC_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          CALLMEBOT_USER: ${{ secrets.CALLMEBOT_USER }}
        run: node monitor.js --once --log-file docs/status.json

      - name: Push status via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error, time, sys

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']
          H = {'Authorization': f'token {token}', 'User-Agent': 'ec-monitor', 'Content-Type': 'application/json'}

          def push_file(path):
              if not os.path.exists(path):
                  return
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              with open(path, 'rb') as f:
                  content_b64 = base64.b64encode(f.read()).decode()
              def get_sha():
                  try:
                      req = urllib.request.Request(url, headers=H)
                      with urllib.request.urlopen(req) as r:
                          return json.load(r).get('sha')
                  except Exception:
                      return None
              for attempt in range(1, 6):
                  sha = get_sha()
                  payload = {'message': f'chore: update {path} [skip ci]', 'content': content_b64}
                  if sha:
                      payload['sha'] = sha
                  put = urllib.request.Request(url, data=json.dumps(payload).encode(), method='PUT', headers=H)
                  try:
                      with urllib.request.urlopen(put) as r:
                          print(f"{path} pushed (HTTP {r.status}) [essai {attempt}]")
                          return
                  except urllib.error.HTTPError as e:
                      if e.code in (409, 422):
                          print(f"  {path}: conflit {e.code} — retry ({attempt}/5)")
                          time.sleep(1.5 + attempt); continue
                      print(f"  {path}: FAILED HTTP {e.code}"); return
                  except Exception as e:
                      print(f"  {path}: FAILED {e}"); return
              print(f"  {path}: abandonné après retries")

          push_file('docs/status.json')
          push_file('docs/last_form.json')   # présent seulement après une détection de créneau
          sys.exit(0)   # un conflit de push n'est pas une panne — ne pas échouer le workflow
          PY
